<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Oreejoy — Admin</title>
    <link rel="stylesheet" href="/static/admin.css">
  </head>
  <body>
    <main class="wrap">
      <h1>Oreejoy Admin — Upload Assets</h1>

      <form id="uploadForm">
        <label>Section
          <select name="section">
            <option value="hero">Hero</option>
            <option value="publications">Publications</option>
          </select>
        </label>

        <label>Title
          <input name="title" required>
        </label>

        <label>Tag
          <input name="tag" required>
        </label>

        <label>Description
          <textarea name="desc" rows="4" required></textarea>
        </label>

        <div id="dropZone" class="dropzone">Drag & drop image here or click to choose</div>
        <input id="fileInput" type="file" name="file" accept="image/*" style="display:none">

        <div class="actions">
          <button type="submit" id="uploadBtn">Upload</button>
          <button type="button" id="gitBtn">Commit & Push to GitHub</button>
        </div>
      </form>

      <div id="status" class="status"></div>
    </main>

    <script src="/static/admin.js"></script>
  </body>
</html>
